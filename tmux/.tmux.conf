# Set vi mode
set -g mode-keys vi

# Enable mouse support (scrolling, clicking panes)
set -g mouse on

# Scroll 1 row at a time not 5
bind -T copy-mode-vi WheelUpPane   send -X -N1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N1 scroll-down

# 256-colour support for Claude Code's TUI
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
# Expose truecolor to programs inside tmux. tmux is RGB-capable (above), but it
# does not propagate COLORTERM, so Claude Code's TUI sees no truecolor hint and
# downgrades 24-bit backgrounds to nearest-256 (dark segment fills → grey).
setenv -g COLORTERM "truecolor"

# Large scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# No delay after pressing Escape
set -sg escape-time 0

# Pass focus events to programs (helps Claude Code's TUI)
set -g focus-events on

# Shift+Enter passthrough (Ghostty → SSH → tmux → Claude Code)
set -s extended-keys always
set -as terminal-features ',xterm*:extkeys'
set -as terminal-overrides '*:ksr=\E[27;2;13~'
set -s user-keys[0] "\033[27;2;13~"
bind-key -n User0 send-keys "\033[27;2;13~"
